# Laboratorio local: sin root y accesible solo desde esta computadora.
worker_processes 1;
pid .run/nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    # Tipos necesarios para los archivos de la web actual.
    types {
        text/html html;
        text/css css;
        image/png png;
        image/svg+xml svg;
    }
    default_type application/octet-stream;
    access_log .run/access.log combined;
    client_body_temp_path .run/client_body;
    proxy_temp_path .run/proxy;
    fastcgi_temp_path .run/fastcgi;
    uwsgi_temp_path .run/uwsgi;
    scgi_temp_path .run/scgi;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root dist;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
